services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: deceptshield
      POSTGRES_DB: deceptshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deceptshield -d deceptshield"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    networks: [internal]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: deceptshield
      PGUSER: deceptshield
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
